name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Wekelijks perf-regressie (niet-blokkerend voor PR's).
    - cron: "0 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (excl. perf)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

  perf:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run perf tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m perf
