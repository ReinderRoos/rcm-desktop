[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcm-desktop"
version = "0.1.0"
description = "RCM2 desktop — Reliability Centered Maintenance, native PySide6 desktop UI op gepoorte RCM1-kern."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "rroos"}]
dependencies = [
    "PySide6>=6.6,<7",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.0",
]

[project.scripts]
rcm = "rcm_core.cli:main"
rcm-desktop = "rcm_desktop.main:main"

[tool.setuptools.packages.find]
include = ["rcm_core*", "rcm_desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
